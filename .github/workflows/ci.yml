# Continuous integration for basicautomation.io.
#
# Scope note: the build is offline. `npm run sync` talks to GitHub and crates.io
# and is deliberately NOT run here — a rate limit or an upstream hiccup would
# fail CI for a reason no contributor can fix. The committed snapshot in
# data/projects.generated.json is what the build reads, and the site fetches
# live data at request time in production.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dependencies move under a frozen lockfile; a weekly run catches a break that
  # no push would have surfaced.
  schedule:
    - cron: "0 5 * * 1"

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx nuxt typecheck
      - name: Build
        run: npm run build
      # The build is only half the claim — prove the server actually starts and
      # renders a page, which a successful bundle does not guarantee.
      - name: Smoke test the rendered site
        run: |
          node .output/server/index.mjs &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/healthz && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3000/healthz >/dev/null
          curl -sf http://127.0.0.1:3000/ | grep -q "Software for the"
          curl -sf http://127.0.0.1:3000/projects/artiqwest | grep -q "artiqwest"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/projects/nope)" = "404"

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only — publishing happens in release.yml, on a tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
