<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">
  <title>Enlil</title>
  <!-- Enlil is the Sumerian lord of wind, so the word becomes wind: ENL holds
       its shape, the second L's foot stretches, the I bends, and the last L
       comes apart into gusts that carry off the right edge. One idea, not a
       pictogram sitting above a wordmark. Letters are paths, never text —
       there is no font to embed and nothing to fall back wrong. Drawn flat in
       the two colours the artiqwest and onyums marks already share. -->
  <g fill="#292d3e">
    <rect x="32" y="85" width="20" height="130"/>
    <rect x="32" y="85" width="70" height="20"/>
    <rect x="32" y="140" width="58" height="20"/>
    <rect x="32" y="195" width="70" height="20"/>
    <rect x="126" y="85" width="20" height="130"/>
    <rect x="196" y="85" width="20" height="130"/>
    <polygon points="126,85 150.3,85 216,215 191.7,215"/>
    <rect x="240" y="85" width="20" height="130"/>
  </g>
  <g fill="none" stroke="#292d3e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250,205 H306 C320,205 330,200 338,190"/>
    <path d="M376,205 L377,150 C377,132 380,116 388,102"/>
    <path d="M434,116 C426,126 424,136 424,150 V205 H494"/>
  </g>
  <g fill="none" stroke="#f5c177" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M456,98 C466,92 474,90 486,90 H560 A22 22 0 1 0 538.75 62.3"/>
    <path d="M496,146 H562"/>
    <path d="M526,205 H596 A22 22 0 1 0 574.75 177.3"/>
  </g>
</svg>
