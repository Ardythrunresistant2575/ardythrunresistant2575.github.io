<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200">
  <title>Enlil</title>
  <!-- Enlil is the Sumerian lord of wind. The word is set in the same heavy
       connected brush script as the onyums mark, in the two colours that set
       shares. The gusts run level and parallel, each ending in a curl that
       turns the same way — wind moves in layers, and a fan radiating from one
       point reads as a claw, not as air. -->
